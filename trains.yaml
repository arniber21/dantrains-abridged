# Train roster for the Dan Trains Abridged mod.
#
# This is the source of truth for all train data. Edit this file, then run
# `npm run build` to regenerate index.js (the file the game actually loads).
# Do not hand-edit index.js -- it is generated and will be overwritten.
#
# Mods run as plain JS via `new Function()` with no `import` support and no
# runtime file loading, so this YAML is compiled into index.js at build time
# rather than being shipped/read at runtime.
#
# `gradeCrossing` selects one of the presets under constants.gradeCrossingPresets,
# or "none" to forbid grade crossings outright. Omit it entirely (as heavy-metro
# and light-metro do below) to leave the base game's own train type untouched.
# `elevationTransitionCosts: true` applies the shared portal/ramp surcharge.
# `stats.crossoverSpeed` defaults to constants.standardCrossoverSpeed if omitted.

constants:
  standardCrossoverSpeed: 6.7
  elevationTransitionCosts:
    portalCost: 10000000
    rampCost: 5000000
  gradeCrossingPresets:
    heavyRail:
      gradeCrossingBaseCost: 300000
      gradeCrossingMaintenancePerYear: 8000
      gradeCrossingTphLimit:
        highway: null
        major: 15
        medium: 18
        minor: 21
    lightRail:
      gradeCrossingBaseCost: 300000
      gradeCrossingMaintenancePerYear: 800
      gradeCrossingTphLimit:
        highway: null
        major: 20
        medium: 20
        minor: 40
newTrainTypes:
- id: gsm
  name: Great Society Metro
  description: Generic heavy rail metro train based off Great Society Metro trains aswell as other modern heavy rail metros built afterwards in the U.S
  stats:
    maxSpeed: 31.3
    maxAcceleration: 1.25
    maxDeceleration: 0.98
    maxLateralAcceleration: 1.63
    maxSlopePercentage: 5.5
    minTurnRadius: 45
    parallelTrackSpacing: 3.76
    trackClearance: 1.86
    minStationTurnRadius: 900
    maxSpeedLocalStation: 14
    minCars: 4
    maxCars: 8
    carsPerCarSet: 2
    capacityPerCar: 222
    carLength: 22.86
    trainWidth: 3.09
    carCost: 2750000
    minStationLength: 100
    maxStationLength: 200
    baseTrackCost: 35000
    baseStationCost: 65000000
    scissorsCrossoverCost: 18750000
    trainOperationalCostPerHour: 215
    carOperationalCostPerHour: 22
    trackMaintenanceCostPerMeter: 360
    stationMaintenanceCostPerYear: 320
    stopTimeSeconds: 24
    tphLimit: 42
  elevationMultipliers:
    DEEP_BORE: 4.6
    STANDARD_TUNNEL: 2.02
    CUT_AND_COVER: 1.01
    AT_GRADE: 0.3
    ELEVATED: 0.81
    TRENCHED: 0.51
    RAMP: 0.51
  compatibleTrackTypes:
  - gsm
  appearance:
    color: '#9D9F9C'
  elevationTransitionCosts: true
  gradeCrossing: none

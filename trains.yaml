# Train roster for the BasedGoat Trains mod.
#
# This is the source of truth for all train data. Edit this file, then run
# `npm run build` to regenerate index.js (the file the game actually loads).
# Do not hand-edit index.js -- it is generated and will be overwritten.
#
# Mods run as plain JS via `new Function()` with no `import` support and no
# runtime file loading, so this YAML is compiled into index.js at build time
# rather than being shipped/read at runtime.
#
# `gradeCrossing` selects one of the presets under constants.gradeCrossingPresets,
# or "none" to forbid grade crossings outright. Omit it entirely (as heavy-metro
# and light-metro do below) to leave the base game's own train type untouched.
# `elevationTransitionCosts: true` applies the shared portal/ramp surcharge.
# `stats.crossoverSpeed` defaults to constants.standardCrossoverSpeed if omitted.
# `modifiedTrainTypes` may be omitted entirely for a mod that only adds new
# train types and doesn't touch any base-game ones.

constants:
  standardCrossoverSpeed: 6.7
  elevationTransitionCosts:
    portalCost: 10000000
    rampCost: 5000000
  gradeCrossingPresets:
    heavyRail:
      gradeCrossingBaseCost: 300000
      gradeCrossingMaintenancePerDay: 8000
      gradeCrossingTphLimit:
        highway: null
        major: 15
        medium: 18
        minor: 21
    lightRail:
      gradeCrossingBaseCost: 300000
      gradeCrossingMaintenancePerDay: 800
      gradeCrossingTphLimit:
        highway: null
        major: 20
        medium: 20
        minor: 40
